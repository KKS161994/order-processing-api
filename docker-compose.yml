services:
  postgres:
    image: postgres:16-alpine
    container_name: order-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: orderapi
      POSTGRES_PASSWORD: orderapi_dev_password
      POSTGRES_DB: order_processing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderapi -d order_processing"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
